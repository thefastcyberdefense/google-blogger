name: Pinned artifact verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fcd-artifact-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run verifier contracts
        run: |
          python3 - <<'PY'
          import unittest
          class Result(unittest.TextTestResult):
              def addFailure(self, test, err):
                  super().addFailure(test, err)
                  print('::error title=Verifier contract::' + test.id().replace('%','%25').replace('\n','%0A') + ': ' + str(err[1]).replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
              def addSubTest(self, test, subtest, err):
                  super().addSubTest(test, subtest, err)
                  if err:
                      print('::error title=Verifier subtest::' + str(subtest).replace('%','%25').replace('\n','%0A').replace('\r','%0D') + ': ' + str(err[1]).replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          suite=unittest.defaultTestLoader.discover('tests/artifact',pattern='test_*.py')
          result=unittest.TextTestRunner(verbosity=2,resultclass=Result).run(suite)
          print(f'::notice title=Verifier totals::tests={result.testsRun}, failures={len(result.failures)}, errors={len(result.errors)}, skipped={len(result.skipped)}')
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
  verify-candidate:
    needs: contracts
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-artifact-verification') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Inspect pinned archive inventory without extracting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 360s python3 - <<'PY'
          import hashlib, importlib.util, io, os, zipfile
          spec=importlib.util.spec_from_file_location('verifier','tools/verify-artifact.py')
          v=importlib.util.module_from_spec(spec);spec.loader.exec_module(v)
          try:
              c=v.CANDIDATE;t=v.Transport(os.environ['GH_TOKEN'])
              blob=t.download(f"/actions/artifacts/{c['artifact_id']}/zip",v.MAX_ARCHIVE_BYTES)
              v.require(len(blob)==c['archive_bytes'] and hashlib.sha256(blob).hexdigest()==c['archive_sha256'],'pinned archive checksum/size mismatch')
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  infos=z.infolist()
                  v.require(len(infos)<=v.MAX_ENTRIES,'entry limit exceeded')
                  print('::notice title=Archive inventory::entries='+str(len(infos))+'; expanded_bytes='+str(sum(i.file_size for i in infos)))
                  for name in v.REQUIRED_FILES:
                      matches=[i for i in infos if i.filename==name]
                      v.require(len(matches)==1,'required member missing or duplicate')
                      print('::notice title=Evidence member::'+name+'; bytes='+str(matches[0].file_size))
          except Exception:
              print('::error title=Inventory blocked::pinned archive inventory unavailable; no raw transport detail logged')
              raise SystemExit(1)
          PY
      - name: Verify pinned candidate without executing artifact code
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: timeout 360s python3 tools/verify-artifact.py
      - name: Upload verified handoff only after success
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fcd-verified-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: verified-handoff/
          if-no-files-found: error
          retention-days: 14
