name: FCD hardened artifact refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh-verified-xml:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-blogger-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Confirm no source drift since tested revision
        run: git diff --exit-code 9a8a1b5969d21ee9bac5c57c2a2e6e9494535ee2 HEAD -- src tools tests fixtures package.json package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: '10068148027'
          run-id: '34256183053'
          github-token: ${{ github.token }}
          path: .verified-evidence
      - name: Copy the compiled artifact only after validating its test reports and stamp
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          evidence=Path('.verified-evidence')
          browser=json.loads((evidence/'test-results/browser.json').read_text())['stats']
          assert browser['expected']==484 and browser['unexpected']==0 and browser['skipped']==0 and browser['flaky']==0, browser
          unit=json.loads((evidence/'test-results/unit.json').read_text())
          assert unit['numPassedTests']==82 and unit['numFailedTests']==0 and unit['numPendingTests']==0
          data=(evidence/'dist/theme.xml').read_bytes()
          root=ET.fromstring(data)
          ns='{http://www.w3.org/1999/xhtml}'
          stamps=[m.get('content') for m in root.findall('.//'+ns+'meta') if m.get('name')=='theme-build']
          assert stamps==['0.1.0+9a8a1b5969d21ee9bac5c57c2a2e6e9494535ee2'],stamps
          Path('dist/theme.xml').write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate theme with foundation hardening'
            git push origin HEAD:refs/heads/feat/fcd-blogger-foundation
          fi
