name: FCD dependency preflight
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Inspect exact published distribution and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fcd-dependencies evidence
          cd /tmp/fcd-dependencies
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund mermaid@11.17.2 prismjs@1.30.0
          npm audit --json > "$GITHUB_WORKSPACE/evidence/audit.json" || audit_exit=$?
          cp package-lock.json "$GITHUB_WORKSPACE/evidence/dependency-lock.json"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          root=Path('/tmp/fcd-dependencies/node_modules/mermaid/dist')
          records=[]
          for p in root.rglob('*.mjs'):
              if 'mermaid.esm.min' not in str(p): continue
              text=p.read_text()
              versions=sorted(set(re.findall(r'DOMPurify[^\n]{0,100}',text)))
              if versions: records.append({'file':str(p.relative_to(root)),'notices':versions,'in_place':text.count('IN_PLACE')})
          req=urllib.request.Request('https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs')
          with urllib.request.urlopen(req,timeout=30) as r: entry=r.read()
          assert entry== (root/'mermaid.esm.min.mjs').read_bytes(),'CDN entry differs from exact npm distribution'
          audit=json.loads(Path('evidence/audit.json').read_text())
          summary={'bundle_dompurify':records,'entry_bytes':len(entry),'audit':audit.get('metadata',{}).get('vulnerabilities',{}),'findings':audit.get('vulnerabilities',{})}
          Path('evidence/preflight.json').write_text(json.dumps(summary,indent=2))
          print('::notice title=Dependency preflight::'+json.dumps(summary).replace('\n',' ')[:12000])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: dependency-preflight-${{ github.event.pull_request.head.sha }}
          path: evidence/
          if-no-files-found: error
