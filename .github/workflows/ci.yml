name: FCD technical-content regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  red-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install vitest run tests/unit/enhancement-loader.test.ts tests/unit/highlighting.test.ts tests/unit/diagrams.test.ts tests/unit/staging-check.test.ts --reporter=default --reporter=json --outputFile=unit-report.json
      - name: Report regression outcomes
        if: ${{ always() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('unit-report.json','utf8'));
          console.log('::notice title=Red regression totals::'+JSON.stringify({passed:r.numPassedTests,failed:r.numFailedTests}));
          for(const s of r.testResults)for(const a of s.assertionResults||[])if(a.status==='failed')console.log('::error title=Regression::'+a.fullName);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: red-regressions
          path: unit-report.json
