name: FCD theme verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fcd-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pinned by owner decision (2026-10-02): ubuntu-latest moves to 26.04
    # between 2026-10-19 and 2026-11-19. Adopt 26.04 only after a full green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      # Lean gate (owner decision 2026-10-05, Ledger rebuild): the theme zip
      # built here is the deliverable, so no generated XML is checked in.
      - name: Build theme bound to the exact source commit
        env:
          THEME_SHA: ${{ env.SOURCE_SHA }}
        run: npm run build
      - name: Report size evidence (only total XML capped)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const xml = fs.readFileSync('dist/theme.xml');
          const size = { source: process.env.SOURCE_SHA, xml: { raw: xml.length, gzip: gzipSync(xml).length } };
          if (size.xml.raw > 500000) throw new Error('Total theme exceeds 500KB');
          console.log('::notice title=Theme size (only total XML capped)::' + JSON.stringify(size));
          JS
      # The N0 boundary self-test launches all three engines inside the namespace.
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run npm test inside the no-egress namespace
        run: |
          bash tools/run-isolated-tests.sh self-test
          # Test output stays plain log lines; the next step reports each failed
          # assertion as one error annotation.
          marker="fcd-unit-$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$marker"
          status=0
          bash tools/run-isolated-tests.sh run unit 300 npm test -- --reporter=default --reporter=json --outputFile=unit-report.json || status=$?
          echo "::$marker::"
          exit "$status"
      - name: Report regression evidence
        if: ${{ always() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const escape = (value) => String(value).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          if (fs.existsSync('unit-report.json')) {
            const r = JSON.parse(fs.readFileSync('unit-report.json', 'utf8'));
            console.log('::notice title=Unit totals::' + JSON.stringify({ passed: r.numPassedTests, failed: r.numFailedTests, pending: r.numPendingTests }));
            for (const s of r.testResults || []) {
              const file = String(s.name).split('/').slice(-3).join('/');
              if (s.status === 'failed' && !(s.assertionResults || []).length) console.log('::error title=Suite failure::' + escape(file + ': ' + String(s.message || '').split('\n')[0].slice(0, 400)));
              for (const a of s.assertionResults || []) {
                if (a.status !== 'failed') continue;
                const reason = String((a.failureMessages || [])[0] || '').split('\n').slice(0, 3).join(' ').slice(0, 3000);
                console.log('::error title=Regression::' + escape(a.fullName + ' :: ' + reason));
              }
            }
          }
          JS
      - name: Run the Ledger V3 contract inside the no-egress namespace
        run: bash tools/run-isolated-tests.sh run contract 120 npm run contract:check
      - name: Finalize isolation evidence
        if: ${{ always() }}
        env:
          FCD_REQUIRED_RUNS: unit contract
        run: bash tools/run-isolated-tests.sh finalize
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: fcd-evidence-${{ env.SOURCE_SHA }}
          path: |
            dist/theme.xml
            package-lock.json
            unit-report.json
            test-results/
          if-no-files-found: error
          retention-days: 14
      # Owner-requested downloadable copy of this run's compiled theme. It runs
      # only after every gate above passed and uploads a zip holding only the
      # XML; the notice and job summary record the XML's own SHA-256.
      # Not a release candidate by itself.
      - name: Stage theme XML artifact after every gate passed
        id: theme
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha), 'THEME_ARTIFACT_SOURCE'
          raw = Path('dist/theme.xml').read_bytes()
          assert 0 < len(raw) <= 500000, 'THEME_ARTIFACT_SIZE'
          ns = '{http://www.w3.org/1999/xhtml}'
          stamps = [m.get('content') or '' for m in ET.fromstring(raw).iter(ns + 'meta') if m.get('name') == 'theme-build']
          assert len(stamps) == 1 and stamps[0].endswith('+' + sha), 'THEME_ARTIFACT_STAMP'
          name = 'fcd-theme-' + sha + '.xml'
          out = Path(os.environ['RUNNER_TEMP']) / 'fcd-theme'
          out.mkdir()
          (out / name).write_bytes(raw)
          record = {'artifact': 'fcd-theme-' + sha, 'file': name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'stamp': stamps[0], 'source': sha, 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          print('::notice title=Theme XML artifact::' + json.dumps(record))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('path=' + str(out / name), file=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('### Theme XML artifact', file=f)
              print('', file=f)
              print('| Field | Value |', file=f)
              print('| --- | --- |', file=f)
              for key in ('artifact', 'file', 'bytes', 'sha256', 'stamp', 'source', 'run', 'attempt'):
                  print('| ' + key + ' | `' + str(record[key]) + '` |', file=f)
              print('', file=f)
              print('Download the artifact zip from this run and extract the XML; the sha256 above is the XML file itself. Uploaded only because every gate in this run passed. It is not a release candidate until it is separately selected and approved.', file=f)
          PY
      - name: Upload theme XML as its own zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fcd-theme-${{ env.SOURCE_SHA }}
          path: ${{ steps.theme.outputs.path }}
          if-no-files-found: error
          retention-days: 90
