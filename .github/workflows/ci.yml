name: FCD verified artifact refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh-verified-xml:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-blogger-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Confirm source still matches the verified revision
        run: git diff --exit-code 677a596283ac20d3c15f689ec4236fdd8c4987a1 HEAD -- src tools fixtures package.json package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: '10066970768'
          run-id: '34253362294'
          github-token: ${{ github.token }}
          path: .verified-evidence
      - name: Preserve only the verified compiled theme
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          data = Path('.verified-evidence/dist/theme.xml').read_bytes()
          root = ET.fromstring(data)
          ns = '{http://www.w3.org/1999/xhtml}'
          stamps = [m.get('content') for m in root.findall('.//'+ns+'meta') if m.get('name') == 'theme-build']
          assert stamps == ['0.1.0+677a596283ac20d3c15f689ec4236fdd8c4987a1'], stamps
          Path('dist/theme.xml').write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate theme with reviewed blocker fixes'
            git push origin HEAD:refs/heads/feat/fcd-blogger-foundation
          fi
