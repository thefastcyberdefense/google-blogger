name: FCD technical dependency lock
on:
  pull_request:
permissions:
  contents: read
jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-technical-content'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit exact integrated lockfile
        run: |
          status=0
          npm audit --json --audit-level=moderate > audit.json || status=$?
          node -e "const a=require('./audit.json');console.log('::notice title=Audit details::'+JSON.stringify(a).replace(/[%\r\n]/g,' ').slice(0,15000));"
          exit "$status"
      - name: Commit only the approved lockfile to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock exact Prism and Mermaid dependency graph'
            git push origin HEAD:refs/heads/feat/fcd-technical-content
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: integrated-audit
          path: audit.json
