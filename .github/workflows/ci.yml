name: FCD hardened artifact refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh-verified-xml:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-blogger-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
      - name: Confirm no source drift since tested revision
        run: git diff --exit-code 9a8a1b5969d21ee9bac5c57c2a2e6e9494535ee2 HEAD -- src tools tests fixtures package.json package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: '10068148027'
          run-id: '34256183053'
          github-token: ${{ github.token }}
          path: .verified-evidence
      - name: Verify tests and artifact stamp before copying only XML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, urllib.request
          import xml.etree.ElementTree as ET
          req=urllib.request.Request('https://api.github.com/repos/thefastcyberdefense/google-blogger/actions/jobs/102162826698',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as response: job=json.load(response)
          assert job['head_sha']=='9a8a1b5969d21ee9bac5c57c2a2e6e9494535ee2' and job['status']=='completed'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for name in ['Run npm ci --ignore-scripts --no-audit --no-fund','Run npm run typecheck','Run npm run build','Run npm run contract:check','Run npm test -- --reporter=default --reporter=json --outputFile=test-results/unit.json','Run npm run test:render','Run npm audit --audit-level=moderate']:
              assert steps[name]=='success',name
          assert [s['name'] for s in job['steps'] if s['conclusion']=='failure']==['Reject stale generated XML apart from its historical build stamp']
          evidence=Path('.verified-evidence')
          browser=json.loads((evidence/'test-results/browser.json').read_text())['stats']
          assert browser['expected']==484 and browser['unexpected']==0 and browser['skipped']==0 and browser['flaky']==0,browser
          data=(evidence/'dist/theme.xml').read_bytes()
          root=ET.fromstring(data)
          ns='{http://www.w3.org/1999/xhtml}'
          stamps=[m.get('content') for m in root.findall('.//'+ns+'meta') if m.get('name')=='theme-build']
          assert stamps==['0.1.0+9a8a1b5969d21ee9bac5c57c2a2e6e9494535ee2'],stamps
          Path('dist/theme.xml').write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate theme with foundation hardening'
            git push origin HEAD:refs/heads/feat/fcd-blogger-foundation
          fi
