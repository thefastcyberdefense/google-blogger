name: FCD theme verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fcd-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ec08c4b9d1ba2cd35d9ec8a9bcbe557f2d01ca3d
          path: .baseline-src
          persist-credentials: false
      - name: Build pinned base and capture size evidence
        run: |
          cd .baseline-src
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          cd ..
          node --input-type=module <<'JS'
          import {assets} from './.baseline-src/tools/generate.ts';
          import fs from 'node:fs';import {gzipSync} from 'node:zlib';
          const data=await assets();const measure=t=>({raw:Buffer.byteLength(t),gzip:gzipSync(t).byteLength});
          const report={source:'ec08c4b9d1ba2cd35d9ec8a9bcbe557f2d01ca3d',css:measure(data.css),js:measure(data.script),xml:measure(fs.readFileSync('.baseline-src/dist/theme.xml','utf8'))};
          fs.writeFileSync('baseline-size.json',JSON.stringify(report,null,2));console.log('::notice title=Pinned baseline::'+JSON.stringify(report));
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: cp dist/theme.xml "$RUNNER_TEMP/checked-in-theme.xml"
      - run: npm run build
        env:
          FCD_BASELINE_REPORT: baseline-size.json
      - name: Record source and output size
        run: |
          git rev-parse HEAD
          sha256sum dist/theme.xml
          node -e "const fs=require('node:fs');console.log('::notice title=Built XML bytes::'+fs.statSync('dist/theme.xml').size);console.log('::notice title=Current asset sizes::'+fs.readFileSync('build-size.json','utf8').replace(/\n/g,''));"
      - run: npm run contract:check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test -- --reporter=default --reporter=json --outputFile=unit-report.json
      - name: Report regression evidence
        if: ${{ always() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';if(fs.existsSync('unit-report.json')){const r=JSON.parse(fs.readFileSync('unit-report.json','utf8'));console.log('::notice title=Unit totals::'+JSON.stringify({passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests}));for(const s of r.testResults||[])for(const a of s.assertionResults||[])if(a.status==='failed')console.log('::error title=Regression::'+a.fullName);}
          JS
      - run: npm run preview -- --build-only
      - run: npm run test:render
      - name: Report browser counts
        if: ${{ always() }}
        run: |
          if [ -f test-results/browser.json ]; then
            node -e "const r=require('./test-results/browser.json');console.log('::notice title=Browser totals::'+JSON.stringify(r.stats));"
          fi
      - run: npm audit --audit-level=moderate
      - name: Reject stale generated XML except historical build stamp
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def normalized(file):
              root=ET.fromstring(Path(file).read_bytes());ns='{http://www.w3.org/1999/xhtml}'
              stamps=[m for m in root.findall('.//'+ns+'meta') if m.get('name')=='theme-build']
              assert len(stamps)==1
              stamps[0].set('content','SOURCE_STAMP')
              return ET.tostring(root)
          assert normalized(Path(os.environ['RUNNER_TEMP'])/'checked-in-theme.xml')==normalized('dist/theme.xml'),'Regenerate checked-in XML from Actions output'
          print('PASS: checked-in XML equals compiled source except historical build stamp')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: fcd-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/theme.xml
            package-lock.json
            baseline-size.json
            build-size.json
            unit-report.json
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
