name: FCD technical XML refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh-xml:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-technical-content'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Check exact tested source has not changed
        run: git diff --exit-code 5d2df4a0a787443a7dbc4e26578dc42af234e3af HEAD -- src tools tests fixtures package.json package-lock.json
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: '10086906848'
          run-id: '34306353365'
          github-token: ${{ github.token }}
          path: .verified-evidence
      - name: Verify reports, upstream job and source stamp before transferring XML only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,hashlib,urllib.request
          import xml.etree.ElementTree as ET
          req=urllib.request.Request('https://api.github.com/repos/thefastcyberdefense/google-blogger/actions/jobs/102323809393',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r: job=json.load(r)
          assert job['head_sha']=='5d2df4a0a787443a7dbc4e26578dc42af234e3af' and job['status']=='completed'
          assert [s['name'] for s in job['steps'] if s['conclusion']=='failure']==['Reject stale generated XML except historical build stamp']
          for s in job['steps']:
              if s['name'] in ['Run npm run build','Run npm run typecheck','Run npm run contract:check','Run npm run test:render','Run npm audit --audit-level=moderate']:
                  assert s['conclusion']=='success',s['name']
          evidence=Path('.verified-evidence')
          unit=json.loads((evidence/'unit-report.json').read_text())
          assert unit['numPassedTests']==107 and unit['numFailedTests']==0 and unit['numPendingTests']==0
          browser=json.loads((evidence/'test-results/browser.json').read_text())['stats']
          assert browser['expected']==594 and browser['unexpected']==0 and browser['skipped']==0 and browser['flaky']==0
          data=(evidence/'dist/theme.xml').read_bytes();root=ET.fromstring(data);ns='{http://www.w3.org/1999/xhtml}'
          stamps=[m.get('content') for m in root.findall('.//'+ns+'meta') if m.get('name')=='theme-build']
          assert stamps==['0.1.0+5d2df4a0a787443a7dbc4e26578dc42af234e3af'] and len(data)<=500000
          Path('dist/theme.xml').write_bytes(data)
          print('::notice title=Regenerated XML::'+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'stamp':stamps[0]}))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate verified Phase 2 technical-content theme'
            git push origin HEAD:refs/heads/feat/fcd-technical-content
          fi
