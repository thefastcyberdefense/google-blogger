name: FCD theme verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fcd-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record exact tested source
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          sha256sum package-lock.json
          echo "Tested source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm run build
      - run: npm run contract:check
      - run: npm test
      - run: npm run preview -- --build-only
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:render
      - name: Report browser counts
        if: ${{ always() }}
        run: |
          if [ -f test-results/browser.json ]; then
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('test-results/browser.json','utf8'));console.log('::notice title=Browser test summary::'+JSON.stringify(r.stats));"
          fi
      - run: npm audit --audit-level=moderate
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fcd-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            package-lock.json
            dist/theme.xml
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
