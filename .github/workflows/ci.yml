name: FCD acceptance XML transfer
on:
  pull_request:
permissions:
  contents: read
jobs:
  transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-publication-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify source unchanged except transfer workflow
        run: test "$(git diff --name-only ba4c9852803cbfcb60d3536199963af395cd6315 HEAD)" = '.github/workflows/ci.yml'
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: '10131362293'
          run-id: '34421613685'
          github-token: ${{ github.token }}
          path: .verified-evidence
          merge-multiple: true
      - name: Validate source, reports and total XML size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os,hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/thefastcyberdefense/google-blogger/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          sha='ba4c9852803cbfcb60d3536199963af395cd6315';job=get('actions/jobs/102698137871')
          assert job['head_sha']==sha and job['status']=='completed'
          assert [s['name'] for s in job['steps'] if s['conclusion']=='failure']==['Reject stale generated XML except historical build stamp']
          for name in ['Run npm run typecheck','Run npm run build','Run npm run contract:check','Run npm test -- --reporter=default --reporter=json --outputFile=unit-report.json','Run npm run test:render','Run npm audit --audit-level=moderate','Run npx --no-install playwright install --with-deps chromium firefox webkit']:
              assert any(s['name']==name and s['conclusion']=='success' for s in job['steps']),name
          meta=get('actions/artifacts/10131362293');assert meta['workflow_run']['head_sha']==sha and not meta['expired']
          assert meta['digest']=='sha256:b096169aa7770de80c8236f4bacc038fb5532024a2ea58667c3defa8ec267a56'
          e=Path('.verified-evidence');u=json.loads((e/'unit-report.json').read_text());report=json.loads((e/'test-results/browser.json').read_text());b=report['stats']
          assert u['numPassedTests']==172 and u['numFailedTests']==u['numPendingTests']==0
          assert b['expected']==1066 and b['unexpected']==b['skipped']==b['flaky']==0
          projects=report['config']['projects'];assert sum(p['name'].startswith('firefox-') for p in projects)==4 and sum(p['name'].startswith('webkit-') for p in projects)==4
          s=json.loads((e/'build-size.json').read_text());assert s['source']==sha
          data=(e/'dist/theme.xml').read_bytes();assert len(data)==95157 and len(data)<=500000
          root=ET.fromstring(data);ns='{http://www.w3.org/1999/xhtml}'
          assert [m.get('content') for m in root.findall('.//'+ns+'meta') if m.get('name')=='theme-build']==['0.1.0+'+sha]
          Path('dist/theme.xml').write_bytes(data);print('::notice title=Verified XML SHA256::'+hashlib.sha256(data).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          test "$(git diff --cached --name-only)" = 'dist/theme.xml'
          git commit -m 'build: regenerate verified acceptance theme XML'
          git push origin HEAD:refs/heads/feat/fcd-publication-acceptance
