name: FCD discovery XML transfer
on:
  pull_request:
permissions:
  contents: read
jobs:
  transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fcd-content-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify only transfer workflow differs
        run: test "$(git diff --name-only bed1f1351db1cb5620dcf3680c7ab3567da0b9c3 HEAD)" = '.github/workflows/ci.yml'
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          artifact-ids: '10100708711'
          run-id: '34342761242'
          github-token: ${{ github.token }}
          path: .verified-evidence
          merge-multiple: true
      - name: Validate source and reports before XML-only transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os,hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/thefastcyberdefense/google-blogger/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          sha='bed1f1351db1cb5620dcf3680c7ab3567da0b9c3';job=get('actions/jobs/102437182398')
          assert job['head_sha']==sha and job['status']=='completed'
          assert [s['name'] for s in job['steps'] if s['conclusion']=='failure']==['Reject stale generated XML except historical build stamp']
          for name in ['Run npm run typecheck','Run npm run build','Run npm run contract:check','Run npm test -- --reporter=default --reporter=json --outputFile=unit-report.json','Run npm run test:render','Run npm audit --audit-level=moderate','Build pinned base and capture size evidence']:
              assert any(s['name']==name and s['conclusion']=='success' for s in job['steps']),name
          meta=get('actions/artifacts/10100708711');assert meta['workflow_run']['head_sha']==sha and not meta['expired']
          assert meta['digest']=='sha256:edcbe765d1fc5a492ca5b38f5ca7502756ea5df62ebbb8dd651d34f8dc5dec03'
          e=Path('.verified-evidence');u=json.loads((e/'unit-report.json').read_text());b=json.loads((e/'test-results/browser.json').read_text())['stats']
          assert u['numPassedTests']==168 and u['numFailedTests']==u['numPendingTests']==0
          assert b['expected']==946 and b['unexpected']==b['skipped']==b['flaky']==0
          s=json.loads((e/'build-size.json').read_text());base=json.loads((e/'baseline-size.json').read_text());assert s['source']==sha and base['source']=='18b127d014e5d02a860603b18f10dd6c7ab81169'
          assert s['css']['raw']-base['css']['raw']<=2048 and s['js']['raw']-base['js']['raw']<=8192
          data=(e/'dist/theme.xml').read_bytes();assert len(data)==95025
          root=ET.fromstring(data);ns='{http://www.w3.org/1999/xhtml}'
          assert [m.get('content') for m in root.findall('.//'+ns+'meta') if m.get('name')=='theme-build']==['0.1.0+'+sha]
          Path('dist/theme.xml').write_bytes(data);print('::notice title=Verified XML SHA256::'+hashlib.sha256(data).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          test "$(git diff --cached --name-only)" = 'dist/theme.xml'
          git commit -m 'build: regenerate verified discovery theme XML'
          git push origin HEAD:refs/heads/feat/fcd-content-discovery
