name: FCD temporary XML transfer
on:
  push:
    branches: [feat/fcd-l1-native-shell]
    paths-ignore: [dist/theme.xml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify XML
        env:
          THEME_SHA: ${{ github.sha }}
        run: |
          npm run build
          npm run contract:check
          test "$(git status --short dist/theme.xml | awk '{print $1}')" = "M"
          test "$(python3 -c 'from pathlib import Path; print(Path("dist/theme.xml").stat().st_size)')" -le 500000
      - name: Commit only generated XML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/theme.xml
          test "$(git diff --cached --name-only)" = "dist/theme.xml"
          git commit -m "build: preserve Actions-generated XML"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/fcd-l1-native-shell
