# TEMPORARY (Ledger rebuild, owner decision 2026-10-05). Rebuilds Ledger-derived
# paths from the pinned upstream commit plus the reviewed edits in
# port/ledger.json and fast-forwards this feature branch. Removed before the
# rebuild is accepted. It runs only for pushes that change port/ on this exact
# branch of this repository, never touches .github, and its push does not
# trigger other workflows.
name: Ledger port writer (temporary)
on:
  push:
    branches: [feat/fcd-ledger-rebuild]
    paths: ['port/**']
permissions:
  contents: read
concurrency:
  group: fcd-ledger-port
  cancel-in-progress: false
jobs:
  port:
    if: github.repository == 'thefastcyberdefense/google-blogger' && github.ref == 'refs/heads/feat/fcd-ledger-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Check out the pinned Ledger release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: redwan-cse/ledger-blogger-theme
          ref: a3da05a8a70243c6ffc239b0e96e88260ed7b536
          path: .ledger-upstream
          persist-credentials: false
      - name: Rebuild Ledger-derived paths
        run: |
          mv .ledger-upstream "$RUNNER_TEMP/ledger-upstream"
          python3 port/apply.py "$RUNNER_TEMP/ledger-upstream"
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        if: ${{ hashFiles('port/lockfile.json') != '' }}
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Reviewed security updates inside the existing semver ranges: only the
      # packages named in port/lockfile.json move, and only package-lock.json
      # changes (no install scripts run).
      - name: Apply reviewed lockfile updates
        if: ${{ hashFiles('port/lockfile.json') != '' }}
        run: |
          mapfile -t pkgs < <(node -e "const l = JSON.parse(require('fs').readFileSync('port/lockfile.json', 'utf8')); for (const p of l.update) { if (!/^(@[a-z0-9._-]+\/)?[a-z0-9._-]+$/.test(p)) throw new Error('bad package name ' + p); console.log(p); }")
          npm update "${pkgs[@]}" --package-lock-only --ignore-scripts --no-audit --no-fund
          git checkout -- package.json
          for p in "${pkgs[@]}"; do node -e "const l = require('./package-lock.json'); for (const [k, v] of Object.entries(l.packages)) if (k.endsWith('node_modules/' + process.argv[1])) console.log(k, v.version)" "$p"; done
      - name: Commit and fast-forward the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -q -- .github
          if git diff --cached --quiet; then echo 'Nothing to port'; exit 0; fi
          git diff --cached --stat
          git commit -q -m "port(ledger): rebuild Ledger v1.7.0 paths for ${GITHUB_SHA}" -m "Upstream redwan-cse/ledger-blogger-theme@a3da05a8a70243c6ffc239b0e96e88260ed7b536 plus the edits in port/ledger.json and the lockfile updates in port/lockfile.json. Written by run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}."
          git push origin HEAD:refs/heads/feat/fcd-ledger-rebuild
