# TEMPORARY (owner request 2026-10-08: patch the katex audit finding,
# GHSA-238p-pmpm-9mq7). Refreshes package-lock.json for the package.json
# katex override on this feature branch only, without install scripts, and
# fast-forwards the branch with the lockfile. Removed in the next commit.
name: Lockfile refresh (temporary)
on:
  push:
    branches: [feat/fcd-ledger-v1.8.0]
    paths: ['package.json']
permissions:
  contents: read
concurrency:
  group: fcd-lock-refresh
  cancel-in-progress: false
jobs:
  lock:
    if: github.repository == 'thefastcyberdefense/google-blogger' && github.ref == 'refs/heads/feat/fcd-ledger-v1.8.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Refresh the lockfile for package.json
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --stat -- package-lock.json
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const k = lock.packages?.['node_modules/katex'] ?? {};
          console.log('::notice title=katex in lock::' + JSON.stringify({ version: k.version, resolved: k.resolved, integrity: k.integrity, dependencies: k.dependencies }));
          const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/audit.json', 'utf8'));
          console.log('::notice title=Audit after refresh::' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          JS
      - name: Commit and fast-forward the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then echo 'Lockfile unchanged'; exit 0; fi
          git diff --cached --stat
          git commit -q -m "chore(deps): refresh package-lock.json for ${GITHUB_SHA}" -m "npm install --package-lock-only --ignore-scripts under the package.json katex override. Written by run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}."
          git push origin HEAD:refs/heads/feat/fcd-ledger-v1.8.0
